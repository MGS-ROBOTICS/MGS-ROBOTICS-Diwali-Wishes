<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGS ROBOTICS - Happy Diwali</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0d0f1a, #1a1c2e);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            z-index: 10;
        }

        /* Logo Styling */
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #ffcc00;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        p {
            font-size: 1.1rem;
            color: #ddd;
            margin-bottom: 20px;
        }

        /* Celebration Image / Banner */
        .banner-img {
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            border: 2px solid rgba(255, 204, 0, 0.3);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Diya Styling */
        .diya-container {
            cursor: pointer;
            position: relative;
            display: inline-block;
            margin: 15px 0;
        }

        .diya-base {
            width: 90px;
            height: 45px;
            background: linear-gradient(to bottom, #d47a19, #8b4513);
            border-radius: 0 0 45px 45px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .flame {
            width: 22px;
            height: 38px;
            background: linear-gradient(to top, #ffcc00, #ff3300);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -32px;
            left: 34px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease-in-out;
            box-shadow: 0 0 20px #ffcc00, 0 0 40px #ff3300;
        }

        .diya-container.lit .flame {
            opacity: 1;
            transform: scale(1);
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.05) rotate(2deg); }
        }

        .instruction {
            margin-top: 15px;
            font-size: 1rem;
            color: #ff9900;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <!-- MGS Robotics Logo -->
        <img src="116855.png" alt="MGS Robotics Logo" class="logo">
        
        <h1>MGS ROBOTICS</h1>
        <p> ✨🪔 ദീപാവലി ആഘോഷ ആശംസകൾ! ✨🪔</p>

        <!-- Celebration Image (Optional: റോബോട്ടിന്റെയും കുട്ടികളുടെയും ചിത്രം ചേർക്കാം) -->
        <img src="watermarked_img_13750265276423301857.png" alt="Diwali Celebration with Robots" class="banner-img">

        <!-- Interactive Diya -->
        <div class="diya-container" id="diya" onclick="lightDiya()">
            <div class="flame" id="flame"></div>
            <div class="diya-base"></div>
        </div>

        <div class="instruction" id="statusText">ദീപം തെളിക്കാൻ ദീപത്തിൽ തൊടൂ! 👇</div>
    </div>

    <!-- Background Music -->
    <audio id="diwaliMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        function lightDiya() {
            const diya = document.getElementById('diya');
            const statusText = document.getElementById('statusText');
            const music = document.getElementById('diwaliMusic');

            // Play music when diya is lit
            music.play().catch(error => console.log("Audio play blocked"));

            diya.classList.add('lit');
            statusText.innerHTML = "🪔 <b>HAPPY DIWALI FROM MGS ROBOTICS!</b> 🪔<br><span style='font-size: 0.85rem; color: #ffcc00;'>സ്ക്രീനിൽ ക്ലിക്ക് ചെയ്ത് കൂടുതൽ ഫയർ വർക്സ് ആസ്വദിക്കൂ!</span>";

            // Trigger Fireworks
            triggerFireworks();

            // Enable screen tap fireworks
            document.body.onclick = (e) => {
                if (e.target.id !== 'diya' && !e.target.closest('.diya-container')) {
                    confetti({
                        particleCount: 60,
                        spread: 70,
                        origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight }
                    });
                }
            };
        }

        function triggerFireworks() {
            var count = 250;
            var defaults = { origin: { y: 0.6 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>
